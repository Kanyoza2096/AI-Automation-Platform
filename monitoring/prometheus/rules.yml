# Prometheus alerting rules for AI-Automation-Platform
# Path: /etc/prometheus/rules.yml

groups:
  - name: ai_automation_alerts
    interval: 30s
    rules:
      # Content Engine Alerts
      - alert: ContentEngineHighErrorRate
        expr: rate(content_engine_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          component: content_engine
        annotations:
          summary: "Content Engine high error rate"
          description: "Error rate > 10% for 2 minutes"

      - alert: ContentEngineOffline
        expr: up{job="content-engine"} == 0
        for: 1m
        labels:
          severity: critical
          component: content_engine
        annotations:
          summary: "Content Engine is offline"
          description: "Content Engine has not responded to health check for 1 minute"

      # Condition Engine Alerts
      - alert: ConditionEngineDecisionLatency
        expr: histogram_quantile(0.95, condition_engine_decision_latency_ms) > 5000
        for: 3m
        labels:
          severity: warning
          component: condition_engine
        annotations:
          summary: "Condition Engine decision latency high"
          description: "p95 latency > 5000ms for 3 minutes"

      - alert: ConditionEngineOffline
        expr: up{job="condition-engine"} == 0
        for: 1m
        labels:
          severity: critical
          component: condition_engine
        annotations:
          summary: "Condition Engine is offline"
          description: "Condition Engine unavailable for 1 minute"

      # Meta Engine Alerts
      - alert: MetaEngineCascadingFailure
        expr: meta_engine_cascading_failures_total > 0
        for: 1m
        labels:
          severity: critical
          component: meta_engine
        annotations:
          summary: "Meta Engine detected cascading failure"
          description: "{{ $value }} dependent engines affected"

      - alert: IncidentEscalation
        expr: meta_engine_unresolved_incidents > 0 and increase(meta_engine_incident_age_seconds[30m]) > 1800
        for: 5m
        labels:
          severity: critical
          component: meta_engine
        annotations:
          summary: "Critical incident unresolved for 30+ minutes"
          description: "Incident escalation required"

      # System Resource Alerts
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage > 85% for 5 minutes"

      - alert: HighCPUUsage
        expr: rate(node_cpu_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage > 80% for 5 minutes"

      # Database Alerts
      - alert: PostgreSQLConnectionPoolExhausted
        expr: pg_stat_activity_count > 90  # Assuming 100 max connections
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection pool nearly exhausted"
          description: "{{ $value }}/100 connections in use"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Memory > 85% for 5 minutes"

      # Event Bus Alerts
      - alert: EventBusLatency
        expr: histogram_quantile(0.95, event_bus_publish_latency_ms) > 1000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Event Bus publish latency high"
          description: "p95 latency > 1000ms for 3 minutes"
