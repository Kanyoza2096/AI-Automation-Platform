version: 2.1

executors:
  kdo-python:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo

commands:
  install_kdo_dependencies:
    steps:
      - run:
          name: Install Linux build dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential \
              pkg-config \
              libcairo2-dev \
              libpango1.0-dev \
              libgdk-pixbuf-2.0-dev \
              libffi-dev \
              libssl-dev \
              libxml2-dev \
              libxslt1-dev \
              libpq-dev \
              shared-mime-info

      - restore_cache:
          keys:
            - kdo-pip-v1-py312-{{ checksum "requirements.txt" }}
            - kdo-pip-v1-py312-

      - run:
          name: Install Python dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install flake8

      - save_cache:
          paths:
            - ~/.cache/pip
          key: kdo-pip-v1-py312-{{ checksum "requirements.txt" }}

jobs:
  quality_and_unit:
    executor: kdo-python
    steps:
      - checkout
      - install_kdo_dependencies

      - run:
          name: Critical lint checks
          command: |
            mkdir -p ci-diagnostics
            set +e
            flake8 . \
              --count \
              --select=E9,F63,F7,F82 \
              --show-source \
              --statistics \
              --exclude=.git,__pycache__,venv,.venv,node_modules,test-results \
              2>&1 | tee ci-diagnostics/critical-lint.log
            status=${PIPESTATUS[0]}
            echo "$status" > ci-diagnostics/critical-lint.status
            exit 0

      - run:
          name: Advisory style analysis
          command: |
            flake8 . \
              --count \
              --exit-zero \
              --max-complexity=10 \
              --max-line-length=127 \
              --statistics \
              --exclude=.git,__pycache__,venv,.venv,node_modules,test-results

      - run:
          name: Run unit and architecture tests
          command: |
            mkdir -p ci-diagnostics test-results
            set +e
            pytest -q \
              --ignore=tests/integration \
              --ignore=tests/chaos \
              --ignore=tests/load \
              --junitxml=test-results/unit.xml \
              --tb=short 2>&1 | tee ci-diagnostics/unit-tests.log
            status=${PIPESTATUS[0]}
            echo "$status" > ci-diagnostics/unit-tests.status
            exit 0

      - store_test_results:
          path: test-results

      - when: always
        steps:
          - store_artifacts:
              path: ci-diagnostics
              destination: ci-diagnostics
          - store_artifacts:
              path: test-results
              destination: test-results

      - run:
          name: Enforce lint and unit-test results
          command: |
            lint_status="$(cat ci-diagnostics/critical-lint.status)"
            test_status="$(cat ci-diagnostics/unit-tests.status)"
            if [ "$lint_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
              echo "CI checks failed: critical_lint=$lint_status unit_tests=$test_status"
              exit 1
            fi

      - run:
          name: Publish failure report to GitHub
          when: on_fail
          command: python .circleci/report_failure.py

  mock_integration_tests:
    executor: kdo-python
    steps:
      - checkout
      - install_kdo_dependencies

      - run:
          name: Run mock-backed integration tests
          command: |
            mkdir -p ci-diagnostics test-results
            set +e
            pytest -q tests/integration \
              --junitxml=test-results/integration.xml \
              --tb=short 2>&1 | tee ci-diagnostics/integration-tests.log
            status=${PIPESTATUS[0]}
            echo "$status" > ci-diagnostics/integration-tests.status
            exit 0

      - store_test_results:
          path: test-results

      - when: always
        steps:
          - store_artifacts:
              path: ci-diagnostics
              destination: ci-diagnostics
          - store_artifacts:
              path: test-results
              destination: test-results

      - run:
          name: Enforce integration test result
          command: |
            status="$(cat ci-diagnostics/integration-tests.status)"
            exit "$status"

      - run:
          name: Publish failure report to GitHub
          when: on_fail
          command: python .circleci/report_failure.py

workflows:
  kdo_ci:
    jobs:
      - quality_and_unit

      - mock_integration_tests:
          requires:
            - quality_and_unit
          filters: pipeline.git.branch == "main" or pipeline.git.branch == "staging"
