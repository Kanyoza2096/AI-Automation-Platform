name: Engineering Vertical Focused Tests

on:
  pull_request:
    paths:
      - "services/kdo_engineering_*.py"
      - "tests/engineering_vertical/**"
      - "migrations/*engineering*"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "Procfile.dev"
      - "scripts/run_kdo_engineering_worker.py"
      - ".github/workflows/engineering-vertical-tests.yml"
      - "core/species_auth.py"
      - "services/connectors/facebook_connector.py"
      - "services/facebook.py"
      - "services/v69_tenant_facebook_connector_factory.py"
      - "services/v69_tenant_facebook_health_producer.py"
      - "tests/test_v69_tenant_facebook_health_producer.py"
      - "services/v69_tenant_facebook_health_context.py"
      - "tests/test_v69_tenant_facebook_health_context.py"
      - "services/business_integration_platform.py"
      - "services/v69_connector_activation_registry.py"
      - "tests/test_facebook_connector_tenant_health.py"
      - "tests/test_v69_tenant_facebook_connector_factory.py"
      # Facebook composition must preserve the resolved Page account identity.
      - "core/api_tokens.py"
      - "core/nerve.py"
      - "core/shared_event_bus.py"
      - "core/organism.py"
      - "organism/lifecycle.py"
      - "organism/goals.py"
      - "tests/test_organism_goal_proposals.py"
      - "organism/goal_persistence.py"
      - "migrations/157_u2_organism_goal_proposals.sql"
      - "migrations/158_u2_durable_event_provenance.sql"
      - "tests/test_organism_goal_persistence.py"
      - "organism/event_bridge.py"
      - "organism/persistence.py"
      - "migrations/155_u2_organism_runtime_snapshots.sql"
      - "migrations/156_u2_organism_runtime_snapshot_minimum_grants.sql"
      - "tests/test_organism_runtime_persistence.py"
      - "tests/test_organism_event_bridge.py"
      - "organism/coordinator.py"
      - "tests/test_organism_cycle_coordinator.py"
      - "tests/test_organism_event_to_ooda.py"
      - "core/autonomous_loop.py"
      - "routes/autonomy_routes.py"
      - "tests/test_autonomy_phase_reporting.py"
      - "tests/test_organism_lifecycle.py"
      - "core/unified_bus.py"
      - "core/durable_event_provenance.py"
      - "tests/test_durable_event_provenance.py"
      - "tests/test_durable_event_provenance_transport.py"
      - "tests/test_unified_bus_provenance_transport.py"
      - "core/event_provenance.py"
      - "core/event_provenance_key_provider.py"
      - "core/event_provenance_runtime.py"
      - "tests/test_event_provenance_key_provider.py"
      - "tests/test_event_provenance_runtime.py"
      - "tests/test_event_provenance_startup_architecture.py"
      - "main.py"
      - "api/dependencies.py"
      - "api/support.py"
      - "tests/test_authenticated_actor_context.py"
      - "docs/organism/u2-producer-provenance-audit.md"
      - "tests/test_event_provenance.py"
      - "utils/ids.py"
      - "tests/security/**"
      - "dependency_registry.py"
      - "lifecycle.py"
      - "core/species_scale.py"
      - "tests/test_species_scale_workspace_hydration.py"
      - "tests/test_architecture_contracts.py"
      - "migrations/066_v69_business_integration_onboarding.sql"
      - "migrations/067_v69_3_5_integration_foundation.sql"
      - "migrations/068_v69_8_connector_activation_registry.sql"
      - "migrations/069_v69_13_integration_evidence.sql"
      - "migrations/100_vnext_connector_health_evidence.sql"
      - "migrations/159_v69_connector_evidence_tenant_fk_hardening.sql"
      - "migrations/160_v69_integration_evidence_atomic_append.sql"
      - "migrations/161_u2_atomic_connector_health_observation.sql"
      - "migrations/162_u2_tenant_connector_resource_binding.sql"
      - "services/v69_connector_runtime_gateway.py"
      - "tests/test_v69_10_connector_runtime_gateway.py"
      - "repositories/social_account_repository.py"
      - "models/social_account.py"
      - "models/brand.py"
      - "core/species_auth.py"
      - "services/v69_tenant_social_account_resolver.py"
      - "tests/test_v69_tenant_social_account_resolver.py"
      # Tenant-scoped read-only health observation and atomic persistence path.
      - "services/v69_integration_evidence.py"
      - "tests/test_v69_integration_evidence_supabase_store.py"
      - "tests/test_v69_13_integration_evidence.py"
      # Durable evidence store and its atomic database append path.
      - "tests/engineering_vertical/test_v69_connector_evidence_tenant_fk.py"
      - "services/vnext_connector_fabric_evidence_read_model.py"
      - "routes/connector_fabric_routes.py"
      - "tests/architecture/test_vnext_connector_fabric_evidence_read_model.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-vertical-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kdo_engineering_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kdo_engineering_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KDO_ENGINEERING_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/kdo_engineering_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system libraries for declared runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2-dev pkg-config python3-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Prepare disposable PostgreSQL queue schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg

          dsn = "postgresql://postgres:postgres@localhost:5432/kdo_engineering_test"
          with psycopg.connect(dsn, autocommit=True) as connection:
              for role in ("service_role", "anon", "authenticated"):
                  exists = connection.execute(
                      "SELECT 1 FROM pg_roles WHERE rolname = %s", (role,)
                  ).fetchone()
                  if not exists:
                      connection.execute(f"CREATE ROLE {role} NOLOGIN")
              # Match Supabase's service_role behavior in this disposable DB.
              connection.execute("ALTER ROLE service_role BYPASSRLS")
              migration = Path(
                  "migrations/140_kdo_engineering_shared_build_queue.sql"
              ).read_text(encoding="utf-8")
              migration_sql = "\n".join(
                  line for line in migration.splitlines()
                  if not line.lstrip().startswith("--")
              )
              comment_marker = (
                  "COMMENT ON TABLE public.kdo_engineering_build_jobs IS"
              )
              schema_sql, marker, comment_sql = migration_sql.partition(
                  comment_marker
              )
              if not marker:
                  raise RuntimeError("queue migration comment statement not found")
              for statement in schema_sql.split(";"):
                  if statement.strip():
                      connection.execute(statement)
              # Keep the COMMENT statement whole: its quoted text contains a
              # semicolon, so it must not be split as if it were SQL syntax.
              connection.execute(comment_marker + comment_sql)

              task_workspace_migration = Path(
                  "migrations/150_kdo_engineering_shared_task_workspace_repositories.sql"
              ).read_text(encoding="utf-8")
              task_workspace_sql = "\n".join(
                  line for line in task_workspace_migration.splitlines()
                  if not line.lstrip().startswith("--")
              )
              for statement in task_workspace_sql.split(";"):
                  if statement.strip():
                      connection.execute(statement)

              approval_migration = Path(
                  "migrations/151_kdo_engineering_plan_approval_task_scope.sql"
              ).read_text(encoding="utf-8")
              approval_sql = "\n".join(
                  line for line in approval_migration.splitlines()
                  if not line.lstrip().startswith("--")
              )
              for statement in approval_sql.split(";"):
                  if statement.strip():
                      connection.execute(statement)

              reconciliation_migration = Path(
                  "migrations/152_kdo_engineering_job_reconciliation_audit.sql"
              ).read_text(encoding="utf-8")
              reconciliation_sql = "\n".join(
                  line for line in reconciliation_migration.splitlines()
                  if not line.lstrip().startswith("--")
              )
              for statement in reconciliation_sql.split(";"):
                  if statement.strip():
                      connection.execute(statement)

              admission_receipt_migration = Path(
                  "migrations/153_kdo_engineering_admission_receipt_gate.sql"
              ).read_text(encoding="utf-8")
              admission_receipt_sql = "\n".join(
                  line for line in admission_receipt_migration.splitlines()
                  if not line.lstrip().startswith("--")
              )
              for statement in admission_receipt_sql.split(";"):
                  if statement.strip():
                      connection.execute(statement)

              # Build a disposable event schema and apply the existing fan-out
              # plus U1 retry migration. This is CI-only PostgreSQL, never staging.
              connection.execute("CREATE SCHEMA IF NOT EXISTS auth")
              connection.execute("""
                  CREATE OR REPLACE FUNCTION auth.uid()
                  RETURNS uuid LANGUAGE sql STABLE AS 'SELECT NULL::uuid'
              """)
              connection.execute("""
                  CREATE TABLE IF NOT EXISTS public.workspaces (
                      id TEXT PRIMARY KEY
                  )
              """)
              connection.execute("""
                  CREATE TABLE IF NOT EXISTS public.workspace_members (
                      workspace_id TEXT NOT NULL,
                      user_id TEXT NOT NULL
                  )
              """)
              connection.execute("""
                  CREATE TABLE IF NOT EXISTS public.brands (
                      id TEXT PRIMARY KEY,
                      workspace_id TEXT NOT NULL
                  )
              """)
              connection.execute("""
                  CREATE TABLE IF NOT EXISTS public.social_accounts (
                      id TEXT PRIMARY KEY,
                      workspace_id TEXT NOT NULL,
                      brand_id TEXT NOT NULL
                  )
              """)

              # Exercise V69 connector-evidence and atomic-append schemas on this disposable
              # PostgreSQL instance. The composite FKs must bind each evidence
              # row to a connection owned by the same workspace.
              for migration_path in (
                  "migrations/066_v69_business_integration_onboarding.sql",
                  "migrations/067_v69_3_5_integration_foundation.sql",
                  "migrations/068_v69_8_connector_activation_registry.sql",
                  "migrations/069_v69_13_integration_evidence.sql",
                  "migrations/100_vnext_connector_health_evidence.sql",
                  "migrations/159_v69_connector_evidence_tenant_fk_hardening.sql",
                  "migrations/160_v69_integration_evidence_atomic_append.sql",
                  "migrations/161_u2_atomic_connector_health_observation.sql",
                  "migrations/162_u2_tenant_connector_resource_binding.sql",
              ):
                  migration_sql = Path(migration_path).read_text(encoding="utf-8")
                  migration_sql = "\n".join(
                      line for line in migration_sql.splitlines()
                      if not line.lstrip().startswith("--")
                  )
                  connection.execute(migration_sql, prepare=False)

              # Verify workspace/brand/Page-account binding and registry-to-connection
              # consistency using only the disposable PostgreSQL instance.
              connection.execute("INSERT INTO public.workspaces (id) VALUES ('ws-resource-a'), ('ws-resource-b') ON CONFLICT DO NOTHING")
              connection.execute("INSERT INTO public.brands (id, workspace_id) VALUES ('brand-resource-a', 'ws-resource-a'), ('brand-resource-b', 'ws-resource-b'), ('brand-resource-c', 'ws-resource-a') ON CONFLICT DO NOTHING")
              connection.execute("INSERT INTO public.social_accounts (id, workspace_id, brand_id) VALUES ('page-resource-a', 'ws-resource-a', 'brand-resource-a'), ('page-resource-b', 'ws-resource-b', 'brand-resource-b'), ('page-resource-c', 'ws-resource-a', 'brand-resource-c') ON CONFLICT DO NOTHING")
              connection.execute("""
                  INSERT INTO public.integration_connections
                      (id, workspace_id, connector_key, brand_id, social_account_id)
                  VALUES ('connection-resource-a', 'ws-resource-a', 'facebook', 'brand-resource-a', 'page-resource-a')
              """)
              connection.execute("""
                  INSERT INTO public.connector_certification_registry
                      (workspace_id, connection_id, connector_key, connector_version,
                       registry_state, brand_id, social_account_id)
                  VALUES ('ws-resource-a', 'connection-resource-a', 'facebook', '1.0.0',
                          'active', 'brand-resource-a', 'page-resource-a')
              """)
              # Legacy rows may remain unbound; partial or mismatched resource
              # bindings must be rejected by database constraints/triggers.
              connection.execute("""
                  INSERT INTO public.integration_connections (id, workspace_id, connector_key)
                  VALUES ('connection-legacy-unbound', 'ws-resource-a', 'facebook')
              """)

              def expect_db_error(statement, error_type, expected_message):
                  try:
                      with connection.transaction():
                          connection.execute(statement)
                  except error_type as exc:
                      if expected_message not in str(exc):
                          raise
                  else:
                      raise RuntimeError(f"expected database rejection: {expected_message}")

              expect_db_error(
                  """
                  INSERT INTO public.integration_connections
                      (id, workspace_id, connector_key, brand_id, social_account_id)
                  VALUES ('connection-wrong-workspace', 'ws-resource-a', 'facebook',
                          'brand-resource-b', 'page-resource-b')
                  """,
                  psycopg.errors.RaiseException,
                  "integration_connection_brand_workspace_mismatch",
              )
              expect_db_error(
                  """
                  INSERT INTO public.integration_connections
                      (id, workspace_id, connector_key, brand_id, social_account_id)
                  VALUES ('connection-wrong-brand', 'ws-resource-a', 'facebook',
                          'brand-resource-a', 'page-resource-c')
                  """,
                  psycopg.errors.RaiseException,
                  "integration_connection_social_account_binding_mismatch",
              )
              expect_db_error(
                  """
                  INSERT INTO public.integration_connections
                      (id, workspace_id, connector_key, brand_id)
                  VALUES ('connection-partial-binding', 'ws-resource-a', 'facebook',
                          'brand-resource-a')
                  """,
                  psycopg.errors.RaiseException,
                  "integration_connection_resource_binding_pair_required",
              )
              expect_db_error(
                  """
                  INSERT INTO public.connector_certification_registry
                      (workspace_id, connection_id, connector_key, connector_version,
                       registry_state, brand_id, social_account_id)
                  VALUES ('ws-resource-a', 'connection-resource-a', 'facebook-alt', '1.0.0',
                          'active', 'brand-resource-c', 'page-resource-c')
                  """,
                  psycopg.errors.ForeignKeyViolation,
                  "connector_certification_resource_binding_fk",
              )
              # Once a connection is bound, the underlying brand/Page resource
              # cannot be moved or deleted out from under that binding.
              expect_db_error(
                  "UPDATE public.social_accounts SET brand_id = 'brand-resource-c' WHERE id = 'page-resource-a'",
                  psycopg.errors.ForeignKeyViolation,
                  "integration_connections_social_account_binding_fk",
              )
              expect_db_error(
                  "UPDATE public.brands SET workspace_id = 'ws-resource-b' WHERE id = 'brand-resource-a'",
                  psycopg.errors.ForeignKeyViolation,
                  "integration_connections_brand_workspace_fk",
              )
              expect_db_error(
                  "DELETE FROM public.social_accounts WHERE id = 'page-resource-a'",
                  psycopg.errors.ForeignKeyViolation,
                  "integration_connections_social_account_binding_fk",
              )
              connection.execute("""
                  CREATE TABLE public.events (
                      id TEXT PRIMARY KEY,
                      event_type TEXT NOT NULL,
                      payload JSONB NOT NULL DEFAULT '{}'::jsonb,
                      workspace_id TEXT,
                      correlation_id TEXT,
                      decision_id TEXT,
                      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
                  )
              """)
              for migration_path in (
                  "migrations/037_durable_event_fanout.sql",
                  "migrations/074_u1_shared_event_delivery_retry_dead_letter.sql",
                  "migrations/075_u1_shared_event_delivery_metrics.sql",
                  "migrations/155_u2_organism_runtime_snapshots.sql",
                  "migrations/156_u2_organism_runtime_snapshot_minimum_grants.sql",
                  "migrations/157_u2_organism_goal_proposals.sql",
                  "migrations/158_u2_durable_event_provenance.sql",
              ):
                  migration_sql = Path(migration_path).read_text(encoding="utf-8")
                  migration_sql = "\n".join(
                      line for line in migration_sql.splitlines()
                      if not line.lstrip().startswith("--")
                  )
                  # The retry migration includes a PL/pgSQL function body with
                  # internal semicolons; send it as one PostgreSQL statement batch.
                  if migration_path.endswith((
                      "074_u1_shared_event_delivery_retry_dead_letter.sql",
                      "075_u1_shared_event_delivery_metrics.sql",
                      "155_u2_organism_runtime_snapshots.sql",
                      "157_u2_organism_goal_proposals.sql",
                  )):
                      connection.execute(migration_sql, prepare=False)
                  else:
                      for statement in migration_sql.split(";"):
                          if statement.strip():
                              connection.execute(statement)

              provenance_column = connection.execute(
                  """
                  SELECT 1 FROM information_schema.columns
                  WHERE table_schema = 'public' AND table_name = 'events'
                    AND column_name = 'provenance_envelope'
                  """
              ).fetchone()
              if not provenance_column:
                  raise RuntimeError("durable event provenance column was not applied")
          PY
      - name: Run focused engineering vertical tests
        run: |
          python -m pytest -q \
            tests/engineering_vertical/test_phase16_2_workflow.py \
            tests/engineering_vertical/test_phase16_3_worker_queue.py \
            tests/engineering_vertical/test_worker_runtime.py \
            tests/engineering_vertical/test_worker_service.py \
            tests/engineering_vertical/test_worker_bootstrap.py \
            tests/engineering_vertical/test_worker_entrypoint.py \
            tests/engineering_vertical/test_phase16_4_shared_queue.py \
            tests/engineering_vertical/test_durable_receipts.py \
            tests/engineering_vertical/test_phase16_4_postgres_integration.py \
            tests/engineering_vertical/test_phase16_5_postgres_repositories.py \
            tests/engineering_vertical/test_phase16_7_dynamic_quality_loop.py \
            tests/engineering_vertical/test_phase16_12_container_worker.py \
            tests/engineering_vertical/test_phase16_13_pipeline_composition.py \
            tests/engineering_vertical/test_phase16_8_console.py \
            tests/engineering_vertical/test_staging_lifecycle.py \
            tests/engineering_vertical/test_dag_coordinator.py \
            tests/engineering_vertical/test_worker_composition.py \
            tests/engineering_vertical/test_worker_authorization.py \
            tests/engineering_vertical/test_staging_worker_host.py \
            tests/engineering_vertical/test_gateway_agents.py \
            tests/engineering_vertical/test_gateway_build_executor.py \
            tests/security/test_phase6_production_tenant_hardening.py \
            tests/security/test_shared_event_bus_safety.py \
            tests/security/test_shared_event_bus_lifecycle.py \
            tests/security/test_phase3_event_architecture.py \
            tests/security/test_u1_shared_event_delivery_reliability.py \
            tests/security/test_u1_shared_event_delivery_migration.py \
            tests/security/test_u1_unified_event_bus_backpressure.py \
            tests/test_organism_lifecycle.py \
            tests/test_organism_goal_proposals.py \
            tests/test_organism_goal_persistence.py \
            tests/test_organism_event_bridge.py \
            tests/test_organism_cycle_coordinator.py \
            tests/test_organism_runtime_persistence.py \
            tests/test_organism_event_to_ooda.py \
            tests/test_autonomy_phase_reporting.py \
            tests/tenancy/test_request_context.py \
            tests/test_architecture_contracts.py::test_unified_event_bus_is_composition_root_authority \
            tests/test_architecture_contracts.py::test_unified_event_bus_has_one_instance_across_di_and_legacy_access \
            tests/test_authenticated_actor_context.py \
            tests/test_event_provenance.py \
            tests/test_event_provenance_key_provider.py \
            tests/test_event_provenance_runtime.py \
            tests/test_event_provenance_startup_architecture.py \
            tests/test_unified_bus_provenance_transport.py \
            tests/test_durable_event_provenance.py \
            tests/test_durable_event_provenance_transport.py \
            tests/engineering_vertical/test_v69_connector_evidence_tenant_fk.py \
            tests/test_v69_integration_evidence_supabase_store.py \
            tests/test_v69_13_integration_evidence.py \
            tests/test_v69_10_connector_runtime_gateway.py \
            tests/test_v69_tenant_social_account_resolver.py \
            tests/test_v69_tenant_facebook_health_producer.py \
            tests/test_v69_tenant_facebook_health_context.py \
            tests/test_facebook_connector_tenant_health.py \
            tests/test_v69_tenant_facebook_connector_factory.py \
            tests/architecture/test_vnext_connector_fabric_evidence_read_model.py
