name: Engineering Vertical Focused Tests

on:
  pull_request:
    paths:
      - "services/kdo_engineering_*.py"
      - "tests/engineering_vertical/**"
      - "migrations/*engineering*"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "Procfile.dev"
      - "scripts/run_kdo_engineering_worker.py"
      - ".github/workflows/engineering-vertical-tests.yml"
      - "core/species_auth.py"
      - "core/api_tokens.py"
      - "core/nerve.py"
      - "core/shared_event_bus.py"
      - "core/organism.py"
      - "organism/lifecycle.py"
      - "organism/goals.py"
      - "tests/test_organism_goal_proposals.py"
      - "organism/goal_persistence.py"
      - "migrations/157_u2_organism_goal_proposals.sql"
      - "tests/test_organism_goal_persistence.py"
      - "organism/event_bridge.py"
      - "organism/persistence.py"
      - "migrations/155_u2_organism_runtime_snapshots.sql"
      - "migrations/156_u2_organism_runtime_snapshot_minimum_grants.sql"
      - "tests/test_organism_runtime_persistence.py"
      - "tests/test_organism_event_bridge.py"
      - "organism/coordinator.py"
      - "tests/test_organism_cycle_coordinator.py"
      - "tests/test_organism_event_to_ooda.py"
      - "core/autonomous_loop.py"
      - "routes/autonomy_routes.py"
      - "tests/test_autonomy_phase_reporting.py"
      - "tests/test_organism_lifecycle.py"
      - "core/unified_bus.py"
      - "utils/ids.py"
      - "tests/security/**"
      - "dependency_registry.py"
      - "lifecycle.py"
      - "core/species_scale.py"
      - "tests/test_species_scale_workspace_hydration.py"
      - "tests/test_architecture_contracts.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-vertical-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kdo_engineering_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kdo_engineering_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KDO_ENGINEERING_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/kdo_engineering_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system libraries for declared runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2-dev pkg-config python3-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Prepare disposable PostgreSQL queue schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg

          dsn = "postgresql://postgres:postgres@localhost:5432/kdo_engineering_test"
          with psycopg.connect(dsn, autocommit=True) as connection:
              for role in ("service_role", "anon", "authenticated"):
                  exists = connection.execute(
                      "SELECT 1 FROM pg_roles WHERE rolname = %s", (role,)
                  ).fetchone()
                  if not exists:
                      connection.execute(f"CREATE ROLE {role} NOLOGIN")
              migration = Path(
                  "migrations/140_kdo_engineering_shared_build_queue.sql"
              ).read_text(encoding="utf-8")
              migration_sql = "\n".join(
                  line for line in migration.splitlines()
                  if not line.lstrip().startswith("--")
              )
              comment_marker = (
                  "COMMENT ON TABLE public.kdo_engineering_build_jobs IS"
              )
              schema_sql, marker, comment_sql = migration_sql.partition(
                  comment_marker
              )
              if not marker:
                  raise RuntimeError("queue migration comment statement not found")
              for statement in schema_sql.split(";"):
                  if statement.strip():
                      connection.execute(statement)
              # Keep the COMMENT statement whole: its quoted text contains a
              # semicolon, so it must not be split as if it were SQL syntax.
              connection.execute(comment_marker + comment_sql)

              task_workspace_migration = Path(
                  "migrations/150_kdo_engineering_shared_task_workspace_repositories.sql"
              ).read_text(encoding="utf-8")
              task_workspace_sql = "\n".join(
                  line for line in task_workspace_migration.splitlines()
                  if not line.lstrip().startswith("--")
              )
              for statement in task_workspace_sql.split(";"):
                  if statement.strip():
                      connection.execute(statement)

              approval_migration = Path(
                  "migrations/151_kdo_engineering_plan_approval_task_scope.sql"
              ).read_text(encoding="utf-8")
              approval_sql = "\n".join(
                  line for line in approval_migration.splitlines()
                  if not line.lstrip().startswith("--")
              )
              for statement in approval_sql.split(";"):
                  if statement.strip():
                      connection.execute(statement)

              reconciliation_migration = Path(
                  "migrations/152_kdo_engineering_job_reconciliation_audit.sql"
              ).read_text(encoding="utf-8")
              reconciliation_sql = "\n".join(
                  line for line in reconciliation_migration.splitlines()
                  if not line.lstrip().startswith("--")
              )
              for statement in reconciliation_sql.split(";"):
                  if statement.strip():
                      connection.execute(statement)

              admission_receipt_migration = Path(
                  "migrations/153_kdo_engineering_admission_receipt_gate.sql"
              ).read_text(encoding="utf-8")
              admission_receipt_sql = "\n".join(
                  line for line in admission_receipt_migration.splitlines()
                  if not line.lstrip().startswith("--")
              )
              for statement in admission_receipt_sql.split(";"):
                  if statement.strip():
                      connection.execute(statement)

              # Build a disposable event schema and apply the existing fan-out
              # plus U1 retry migration. This is CI-only PostgreSQL, never staging.
              connection.execute("CREATE SCHEMA IF NOT EXISTS auth")
              connection.execute("""
                  CREATE OR REPLACE FUNCTION auth.uid()
                  RETURNS uuid LANGUAGE sql STABLE AS 'SELECT NULL::uuid'
              """)
              connection.execute("""
                  CREATE TABLE public.workspace_members (
                      workspace_id TEXT NOT NULL,
                      user_id TEXT NOT NULL
                  )
              """)
              connection.execute("""
                  CREATE TABLE public.events (
                      id TEXT PRIMARY KEY,
                      event_type TEXT NOT NULL,
                      payload JSONB NOT NULL DEFAULT '{}'::jsonb,
                      workspace_id TEXT,
                      correlation_id TEXT,
                      decision_id TEXT,
                      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
                  )
              """)
              for migration_path in (
                  "migrations/037_durable_event_fanout.sql",
                  "migrations/074_u1_shared_event_delivery_retry_dead_letter.sql",
                  "migrations/075_u1_shared_event_delivery_metrics.sql",
                  "migrations/155_u2_organism_runtime_snapshots.sql",
                  "migrations/156_u2_organism_runtime_snapshot_minimum_grants.sql",
                  "migrations/157_u2_organism_goal_proposals.sql",
              ):
                  migration_sql = Path(migration_path).read_text(encoding="utf-8")
                  migration_sql = "\n".join(
                      line for line in migration_sql.splitlines()
                      if not line.lstrip().startswith("--")
                  )
                  # The retry migration includes a PL/pgSQL function body with
                  # internal semicolons; send it as one PostgreSQL statement batch.
                  if migration_path.endswith((
                      "074_u1_shared_event_delivery_retry_dead_letter.sql",
                      "075_u1_shared_event_delivery_metrics.sql",
                      "155_u2_organism_runtime_snapshots.sql",
                  )):
                      connection.execute(migration_sql, prepare=False)
                  else:
                      for statement in migration_sql.split(";"):
                          if statement.strip():
                              connection.execute(statement)
          PY
      - name: Run focused engineering vertical tests
        run: |
          python -m pytest -q \
            tests/engineering_vertical/test_phase16_2_workflow.py \
            tests/engineering_vertical/test_phase16_3_worker_queue.py \
            tests/engineering_vertical/test_worker_runtime.py \
            tests/engineering_vertical/test_worker_service.py \
            tests/engineering_vertical/test_worker_bootstrap.py \
            tests/engineering_vertical/test_worker_entrypoint.py \
            tests/engineering_vertical/test_phase16_4_shared_queue.py \
            tests/engineering_vertical/test_durable_receipts.py \
            tests/engineering_vertical/test_phase16_4_postgres_integration.py \
            tests/engineering_vertical/test_phase16_5_postgres_repositories.py \
            tests/engineering_vertical/test_phase16_7_dynamic_quality_loop.py \
            tests/engineering_vertical/test_phase16_12_container_worker.py \
            tests/engineering_vertical/test_phase16_13_pipeline_composition.py \
            tests/engineering_vertical/test_phase16_8_console.py \
            tests/engineering_vertical/test_staging_lifecycle.py \
            tests/engineering_vertical/test_dag_coordinator.py \
            tests/engineering_vertical/test_worker_composition.py \
            tests/engineering_vertical/test_worker_authorization.py \
            tests/engineering_vertical/test_staging_worker_host.py \
            tests/engineering_vertical/test_gateway_agents.py \
            tests/engineering_vertical/test_gateway_build_executor.py \
            tests/security/test_phase6_production_tenant_hardening.py \
            tests/security/test_shared_event_bus_safety.py \
            tests/security/test_shared_event_bus_lifecycle.py \
            tests/security/test_phase3_event_architecture.py \
            tests/security/test_u1_shared_event_delivery_reliability.py \
            tests/security/test_u1_shared_event_delivery_migration.py \
            tests/security/test_u1_unified_event_bus_backpressure.py \
            tests/test_organism_lifecycle.py \
            tests/test_organism_goal_proposals.py \
            tests/test_organism_goal_persistence.py \
            tests/test_organism_event_bridge.py \
            tests/test_organism_cycle_coordinator.py \
            tests/test_organism_runtime_persistence.py \
            tests/test_organism_event_to_ooda.py \
            tests/test_autonomy_phase_reporting.py \
            tests/tenancy/test_request_context.py \
            tests/test_architecture_contracts.py::test_unified_event_bus_is_composition_root_authority \
            tests/test_architecture_contracts.py::test_unified_event_bus_has_one_instance_across_di_and_legacy_access
