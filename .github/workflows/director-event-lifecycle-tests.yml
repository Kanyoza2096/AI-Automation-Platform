# Manual workflow_dispatch is available for targeted branch certification.
name: Cross-Subsystem Event Lifecycle Tests

on:
  pull_request:
    paths:
      - "api/chat_action_proposals.py"
      - "api/routers/ai_chat.py"
      - "tests/test_ai_chat_action_proposals.py"
      - "tests/test_ai_engine_collaboration.py"
      - "services/director/core.py"
      - "services/director/health_briefing.py"
      - "services/health_monitor_service.py"
      - "tests/test_director_health_briefing.py"
      - "services/director/planning.py"
      - "ai/gateway.py"
      - "services/connectors/cloudflare_ai_adapter.py"
      - "services/connectors/gemini_ai_adapter.py"
      - "services/ai_provider.py"
      - "services/ai_policy.py"
      - "tests/test_ai_provider_fabric.py"
      - "lifecycle.py"
      - "services/director/stores.py"
      - "services/director/api.py"
      - "migrations/163_u2_director_strategic_plans.sql"
      - "tests/test_director_strategic_plan_persistence.py"
      - "tests/test_director_strategic_planning.py"
      - "services/director/models.py"
      - "services/director/analysis.py"
      - "tests/test_director_strategic_context.py"
      - "services/director/orchestration/**"
      - "core/event_consumer.py"
      - "services/job_stats_service.py"
      - "tests/test_event_consumer_platform_recovery.py"
      - "tests/test_platform_automation_job_diagnostics_adapter.py"
      - "tests/test_job_stats_failure_samples.py"
      - "migrations/182_platform_director_recovery_mission_admission.sql"
      - "migrations/183_governed_provider_retry.sql"
      - "services/governed_provider_recovery.py"
      - "tests/test_governed_provider_recovery.py"
      - "tests/test_director_native_engine_adapters.py"
      - "tests/test_director_mission_state_machine.py"
      - "tests/test_director_mission_runtime.py"
      - "tests/test_director_mission_graph.py"
      - "tests/test_director_swarm_planning.py"
      - "tests/test_ai_provider_fabric.py"
      - "migrations/175_director_mission_admission_scope_contract.sql"
      - "migrations/176_director_mission_runtime_and_event_journal.sql"
      - "migrations/177_director_mission_journal_privilege_hardening.sql"
      - "migrations/178_director_mission_event_task_scope_guard.sql"
      - "migrations/179_director_mission_runtime_initial_state.sql"
      - "migrations/180_director_mission_foreign_key_indexes.sql"
      - "migrations/181_director_atomic_task_event_sync.sql"
      - "tests/test_director_executive_report_truth.py"
      - "tests/test_director_decision_evidence.py"
      - "tests/test_director_learning_evidence.py"
      - "tests/test_director_capability_audit.py"
      - "services/director/orchestration/**"
      - "tests/test_director_native_engine_adapters.py"
      - "tests/test_director_mission_state_machine.py"
      - "tests/test_director_mission_runtime.py"
      - "tests/test_director_mission_graph.py"
      - "migrations/175_director_mission_admission_scope_contract.sql"
      - "migrations/176_director_mission_runtime_and_event_journal.sql"
      - "migrations/177_director_mission_journal_privilege_hardening.sql"
      - "migrations/178_director_mission_event_task_scope_guard.sql"
      - "migrations/179_director_mission_runtime_initial_state.sql"
      - "migrations/180_director_mission_foreign_key_indexes.sql"
      - "api/engine_handoff_evidence.py"
      - "api/routers/ai_chat.py"
      - "tests/test_engine_handoff_evidence.py"
      - ".github/workflows/director-event-lifecycle-tests.yml"
  push:
    branches:
      - staging
      - feat/director-orchestration-architecture
    paths:
      - "core/shared_event_bus.py"
      - "tests/security/test_shared_event_bus_safety.py"
      - "services/director/core.py"
      - "services/director/utils.py"
      - "tests/services/test_director_event_delivery.py"
      - "dependency_registry.py"
      - "tests/test_architecture_contracts.py"
      - "services/health_monitor_service.py"
      - "services/meta_engine/core.py"
      - "services/engine_health_handlers.py"
      - "tests/test_engine_truth.py"
      - "lifecycle.py"
      - "tests/test_meta_engine_lifecycle_identity.py"
      - "tests/test_health_monitor_observability.py"
      - "services/condition_engine/core.py"
      - "services/condition_engine/utils.py"
      - "council/integration/condition_engine_integration.py"
      - "tests/test_condition_engine_event_context.py"
      - "tests/test_condition_engine_council_approval_fence.py"
      - "api/engine_handoff_evidence.py"
      - "api/routers/ai_chat.py"
      - "tests/test_engine_handoff_evidence.py"
      - "services/director/orchestration/**"
      - "tests/test_director_native_engine_adapters.py"
      - "tests/test_director_mission_state_machine.py"
      - "tests/test_director_mission_runtime.py"
      - "tests/test_director_mission_graph.py"
      - ".github/workflows/director-event-lifecycle-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-subsystem-event-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-subsystem-event-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries for declared runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2-dev pkg-config python3-dev
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile governed chat route and proposal module
        run: python -m compileall -q api/chat_action_proposals.py api/engine_handoff_evidence.py api/routers/ai_chat.py
      - name: Verify Director event lifecycle and architecture contracts
        run: |
          python -m pytest -q \
            tests/security/test_shared_event_bus_safety.py \
            tests/services/test_director_event_delivery.py \
            tests/test_condition_engine_event_context.py \
            tests/test_condition_engine_council_approval_fence.py \
            tests/test_health_monitor_observability.py \
            tests/test_director_strategic_context.py \
            tests/test_director_strategic_planning.py \
            tests/test_ai_provider_fabric.py \
            tests/test_ai_chat_action_proposals.py \
            tests/test_ai_engine_collaboration.py \
            tests/test_director_strategic_plan_persistence.py \
            tests/test_director_auth_boundary.py \
            tests/test_director_executive_report_truth.py \
            tests/test_director_decision_evidence.py \
            tests/test_director_learning_evidence.py \
            tests/test_director_capability_audit.py \
            tests/test_director_native_engine_adapters.py \
            tests/test_director_mission_state_machine.py \
            tests/test_director_mission_runtime.py \
            tests/test_director_mission_graph.py \
            tests/test_director_swarm_planning.py \
            tests/test_event_consumer_platform_recovery.py \
            tests/test_platform_automation_job_diagnostics_adapter.py \
            tests/test_job_stats_failure_samples.py \
            tests/test_governed_provider_recovery.py \
            tests/test_engine_handoff_evidence.py \
            tests/test_engine_truth.py \
            tests/test_director_health_briefing.py \
            tests/test_meta_engine_lifecycle_identity.py \
            tests/test_architecture_contracts.py::test_unified_event_bus_is_composition_root_authority \
            tests/test_architecture_contracts.py::test_unified_event_bus_has_one_instance_across_di_and_legacy_access \
            tests/test_architecture_contracts.py::test_preboot_unified_bus_adopts_bootstrapped_supabase_client
