name: Website Integration Contract Tests

on:
  pull_request:
    paths:
      - "contracts/website_integration.py"
      - "application/website_integrations.py"
      - "api/application_dependencies.py"
      - "services/integrations/website_integration_service.py"
      - "services/business_automation_event_bridge.py"
      - "tests/test_website_nextjs_integration.py"
      - "tests/test_business_automation_event_bridge.py"
      - "tests/architecture/test_phase5_website_integration_boundary.py"
      - ".github/workflows/website-integration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile integration modules
        run: |
          python -m py_compile \
            contracts/website_integration.py \
            application/website_integrations.py \
            api/application_dependencies.py \
            services/integrations/website_integration_service.py \
            services/business_automation_event_bridge.py
      - name: Run Website Integration and replay-safety tests
        run: |
          python -m pytest -q \
            tests/test_website_nextjs_integration.py \
            tests/test_business_automation_event_bridge.py \
            tests/architecture/test_phase5_website_integration_boundary.py
