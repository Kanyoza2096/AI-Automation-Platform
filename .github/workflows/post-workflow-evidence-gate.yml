name: Post Workflow Evidence Gate Tests

on:
  pull_request:
    paths:
      - "workflows/post_workflow.py"
      - "services/content_evidence.py"
      - "services/content_semantic_reviewer.py"
      - "services/content_semantic_shadow_runner.py"
      - "scripts/run_staging_semantic_shadow_eval.py"
      - "dependency_registry.py"
      - "services/knowledge_base.py"
      - "repositories/knowledge_repository.py"
      - "domain/content/topic_selector.py"
      - "tests/test_post_workflow_evidence_gate.py"
      - "tests/test_content_semantic_reviewer.py"
      - "tests/test_content_semantic_shadow_runner.py"
      - "tests/test_staging_semantic_shadow_operator.py"
      - "tests/test_knowledge_base_retrieval.py"
      - "tests/test_knowledge_repository_fail_closed.py"
      - "tests/test_knowledge_repository_workspace_scope.py"
      - ".github/workflows/post-workflow-evidence-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-workflow-evidence-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libcairo2-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9"
      - name: Compile staging shadow operator script
        run: python -m py_compile scripts/run_staging_semantic_shadow_eval.py
      - name: Run post workflow evidence gate tests
        run: python -m pytest -q tests/test_post_workflow_evidence_gate.py tests/test_content_semantic_reviewer.py tests/test_content_semantic_shadow_runner.py tests/test_staging_semantic_shadow_operator.py tests/test_knowledge_base_retrieval.py tests/test_knowledge_repository_fail_closed.py tests/test_knowledge_repository_workspace_scope.py
