name: Deploy to Staging

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'docker/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: aws/task-definition.json
          container-name: ai-automation
          image: ${{ secrets.DOCKER_USERNAME }}/ai-automation:${{ github.sha }}
      
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ai-automation-staging
          cluster: staging
          wait-for-service-stability: true
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          curl -f http://staging.ai-automation.internal/health || exit 1
      
      - name: Notify deployment
        if: success()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Deployed to staging!\n\n- **Commit:** ${{ github.sha }}\n- **Environment:** Staging\n- **Status:** Ready for testing'
            })
