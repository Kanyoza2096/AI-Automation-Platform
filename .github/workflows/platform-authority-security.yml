name: Platform Authority Security

on:
  push:
    branches:
      - "security/platform-super-admin-staging"
  pull_request:
    branches:
      - staging
    paths:
      - "config/settings.py"
      - "config/environments.py"
      - "core/species_auth.py"
      - "core/request_context.py"
      - "middleware/request_context_middleware.py"
      - "tests/test_service_auth_only_workspace_bypass.py"
      - "tests/test_environment_classification.py"
      - "api/v1.py"
      - "tests/security/test_platform_authority.py"
      - ".github/workflows/platform-authority-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-authority-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "pydantic>=2.5,<3" "pydantic-settings>=2.1" "pytest>=8.0"
      - name: Compile changed Python modules
        run: python -m py_compile config/environments.py config/settings.py core/species_auth.py core/request_context.py middleware/request_context_middleware.py api/v1.py
      - name: Run platform authority regression tests
        run: python -m pytest tests/security/test_platform_authority.py tests/test_service_auth_only_workspace_bypass.py tests/test_environment_classification.py -q
