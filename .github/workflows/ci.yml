# .github/workflows/ci.yml — Kanyoza Systems Bot CI
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 bandit

      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,venv,.venv,node_modules

      - name: Security scan with bandit
        run: bandit -r . -x .git,__pycache__,venv,.venv,node_modules -ll

      - name: Check for hardcoded secrets
        run: |
          if grep -r "ghp_\|sk-\|AIza\|AKIA\|eyJ" --include="*.py" --exclude-dir={.git,venv,.venv,__pycache__} .; then
            echo "⚠️  Warning: Potential secrets found in code"
          fi
