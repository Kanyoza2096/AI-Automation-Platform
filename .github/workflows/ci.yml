name: Python Core CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Runtime preflight
        run: python scripts/runtime_preflight.py
      - name: Test
        run: python -m pytest -q
      - name: Production artifact gate
        run: python scripts/production_gate.py --skip-tests
