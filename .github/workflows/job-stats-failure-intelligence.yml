name: Job Stats Failure Intelligence Tests

on:
  pull_request:
    branches: [staging, feat/platform-recovery-mission-admission]
    paths:
      - "services/job_stats_service.py"
      - "services/governed_provider_recovery.py"
      - "tests/test_governed_provider_recovery.py"
      - "tests/test_job_stats_service_health_identity.py"
      - "tests/test_job_stats_failure_samples.py"
      - ".github/workflows/job-stats-failure-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  job-stats-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile JobStatsService
        run: python -m py_compile services/job_stats_service.py services/governed_provider_recovery.py
      - name: Run JobStatsService regression tests
        run: python -m pytest -q tests/test_job_stats_service_health_identity.py tests/test_job_stats_failure_samples.py tests/test_governed_provider_recovery.py
