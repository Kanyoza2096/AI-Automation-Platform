name: Command Center Evidence Provenance

on:
  push:
    branches:
      - "feat/command-center-evidence-provenance"
  pull_request:
    branches:
      - staging
    paths:
      - "core/evidence_provenance.py"
      - "routes/command_center_routes.py"
      - "api/routers/system.py"
      - "tests/test_evidence_provenance.py"
      - ".github/workflows/command-center-evidence-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install "pytest>=8.0"
      - name: Compile changed modules
        run: python -m py_compile core/evidence_provenance.py routes/command_center_routes.py api/routers/system.py
      - name: Run provenance regression tests
        run: python -m pytest tests/test_evidence_provenance.py -q
