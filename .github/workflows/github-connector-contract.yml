name: Backend GitHub Connector Contract CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  github-connector-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile GitHub Connector routes
        run: python -m py_compile plugins/github_connector/routes/admin.py plugins/github_connector/routes/contracts.py
      - name: Run GitHub Connector contract tests
        run: python -m pytest -q tests/test_github_connector_contracts.py
