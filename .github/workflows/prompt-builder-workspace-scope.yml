name: Prompt Builder Workspace Scope Tests

on:
  pull_request:
    paths:
      - "services/prompt_builder.py"
      - "services/knowledge_base.py"
      - "models/brand.py"
      - "tests/test_prompt_builder_workspace_scope.py"
      - ".github/workflows/prompt-builder-workspace-scope.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-builder-workspace-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace-scope-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9"
      - name: Run synthetic workspace isolation tests
        run: python -m pytest -q tests/test_prompt_builder_workspace_scope.py
