name: Backend Condition Engine Contract CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  condition-engine-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Condition Engine surface
        run: python -m py_compile routes/cp_surface_routes.py services/condition_engine/__init__.py services/condition_engine/models.py
      - name: Run Condition Engine route contract tests
        run: python -m pytest -q tests/test_condition_surface_routes.py
