name: Director Executive Report Truth Tests

on:
  pull_request:
    paths:
      - "services/director/core.py"
      - "tests/test_director_executive_report_truth.py"
      - ".github/workflows/director-executive-report-truth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: director-executive-report-truth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  director-report-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libcairo2-dev
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9"
      - name: Run Director executive report truth tests
        run: python -m pytest -q tests/test_director_executive_report_truth.py
