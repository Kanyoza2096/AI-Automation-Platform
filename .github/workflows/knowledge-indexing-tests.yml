name: Knowledge indexing regression tests

on:
  pull_request:
    paths:
      - "repositories/knowledge_repository.py"
      - "repositories/base.py"
      - "services/knowledge_base.py"
      - "models/knowledge_entry.py"
      - "models/base.py"
      - "tests/test_knowledge_repository_fail_closed.py"
      - "tests/test_eval_retrieval.py"
      - "tests/test_knowledge_base_retrieval.py"
      - "scripts/eval_retrieval.py"
      - "workflows/post_workflow.py"
      - "services/content_evidence.py"
      - "services/content_semantic_reviewer.py"
      - "services/pipeline/pipeline.py"
      - "dependency_registry.py"
      - "domain/content/topic_selector.py"
      - "repositories/knowledge_repository.py"
      - "tests/test_post_workflow_evidence_gate.py"
      - "tests/test_content_semantic_reviewer.py"
      - "tests/test_content_pipeline_semantic_gate.py"
      - "tests/test_knowledge_repository_workspace_scope.py"
      - ".github/workflows/post-workflow-evidence-gate.yml"
      - ".github/workflows/knowledge-indexing-tests.yml"
  push:
    branches:
      - main
      - "fix/knowledge-indexing-reliability"

jobs:
  knowledge-indexing-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries for workflow tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libcairo2-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9" "pytest-asyncio>=0.23"
      - name: Run knowledge, evidence, and semantic publication tests
        run: python -m pytest -q tests/test_knowledge_repository_fail_closed.py tests/test_eval_retrieval.py tests/test_knowledge_base_retrieval.py tests/test_post_workflow_evidence_gate.py tests/test_content_semantic_reviewer.py tests/test_content_pipeline_semantic_gate.py tests/test_knowledge_repository_workspace_scope.py
