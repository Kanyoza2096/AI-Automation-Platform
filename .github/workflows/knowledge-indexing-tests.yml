name: Knowledge indexing regression tests

on:
  pull_request:
    paths:
      - "repositories/knowledge_repository.py"
      - "models/knowledge_entry.py"
      - "models/base.py"
      - "tests/test_knowledge_repository_fail_closed.py"
      - ".github/workflows/knowledge-indexing-tests.yml"
  push:
    branches:
      - main
      - "fix/knowledge-indexing-reliability"

jobs:
  knowledge-indexing-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install "pytest>=8,<9" "pydantic>=2.5,<3"
      - name: Run knowledge repository regression tests
        run: python -m pytest -q tests/test_knowledge_repository_fail_closed.py
