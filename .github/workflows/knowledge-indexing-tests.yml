name: Knowledge indexing regression tests

on:
  pull_request:
    paths:
      - "repositories/knowledge_repository.py"
      - "repositories/base.py"
      - "services/knowledge_base.py"
      - "models/knowledge_entry.py"
      - "models/base.py"
      - "tests/test_knowledge_repository_fail_closed.py"
      - "tests/test_eval_retrieval.py"
      - "tests/test_knowledge_base_retrieval.py"
      - "scripts/eval_retrieval.py"
      - "services/experimental_query_understanding.py"
      - "services/experimental_query_frames.py"
      - "tests/test_experimental_query_understanding.py"
      - "tests/test_experimental_query_frames.py"
      - "scripts/experimental_query_understanding.py"
      - "tests/test_experimental_query_understanding.py"
      - ".github/workflows/knowledge-indexing-tests.yml"
  push:
    branches:
      - main
      - "fix/knowledge-indexing-reliability"

jobs:
  knowledge-indexing-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install "pytest>=8,<9" "pytest-asyncio>=0.23" "pydantic>=2.5,<3"
      - name: Run knowledge repository and retrieval evaluation tests
        run: python -m pytest -q tests/test_knowledge_repository_fail_closed.py tests/test_eval_retrieval.py tests/test_knowledge_base_retrieval.py tests/test_experimental_query_understanding.py
