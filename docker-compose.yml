# docker-compose.yml — Kanyoza Systems Bot v7.0
version: '3.8'

services:
  bot:
    build: .
    ports:
      - "5000:5000"
    environment:
      - GEMINI_KEY=${GEMINI_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-pro}
      - PAGE_ACCESS_TOKEN=${PAGE_ACCESS_TOKEN}
      - PAGE_ID=${PAGE_ID}
      - VERIFY_TOKEN=${VERIFY_TOKEN}
      - APP_SECRET=${APP_SECRET}
      - OWNER_PSID=${OWNER_PSID}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GUARDIAN_ENABLED=${GUARDIAN_ENABLED:-false}
      - CONTENT_POSTING_HOURS_UTC=${CONTENT_POSTING_HOURS_UTC:-4,7,10,14,17,19}
      - NEWS_POSTING_HOURS_UTC=${NEWS_POSTING_HOURS_UTC:-6,13,18}
      - PORT=5000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    restart: unless-stopped
    volumes:
      - ./data:/app/data
