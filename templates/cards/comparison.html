<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0F172A;
    width: 1080px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
}
.card {
    background: #1E293B;
    width: 1020px;
    height: 1020px;
    border-radius: 28px;
    padding: 48px 52px 40px 52px;
    display: flex;
    flex-direction: column;
    border: 1px solid #334155;
    box-shadow: 0 32px 80px rgba(0,0,0,0.65);
}
.header { flex-shrink: 0; margin-bottom: 20px; }
.badge {
    background: linear-gradient(135deg, #4F46E5, #7C3AED);
    color: #fff;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: inline-block;
}
h1 {
    color: #F1F5F9;
    font-size: 36px;
    font-weight: 800;
    margin-top: 14px;
    line-height: 1.2;
}
.chart {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
}
.chart svg {
    width: 100%;
    height: auto;
    max-height: 660px;
}
.footer {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #334155;
}
.brand { color: #64748B; font-size: 15px; font-weight: 600; }
.tagline { color: #4F46E5; font-size: 14px; font-weight: 600; }
.hashtags {
    color: #475569;
    font-size: 12px;
    margin-top: 6px;
    line-height: 1.4;
}
</style>
</head>
<body>
<div class="card">
    <div class="header">
        <span class="badge">{{ theme_label }}</span>
        <h1>{{ title }}</h1>
    </div>
    <div class="chart">{{ svg_chart | safe }}</div>
    <div class="footer">
        <div>
            <div class="brand">Kanyoza Systems</div>
            {% if hashtags %}
            <div class="hashtags">{% for tag in hashtags[:5] %}#{{ tag }} {% endfor %}</div>
            {% endif %}
        </div>
        <span class="tagline">Daily Tech Insights</span>
    </div>
</div>
</body>
</html>
